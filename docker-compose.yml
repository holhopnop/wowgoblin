services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goblin
      POSTGRES_DB: goblin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped
  sync:
    build: .
    env_file: .env
    depends_on: [db]
    restart: unless-stopped
volumes:
  pgdata:
